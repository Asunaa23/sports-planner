<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sports Planner</title>

  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <main>

    <header class="app-header">
      <div>
        <h1 class="brand">
          <img src="icons/icon512.png" alt="">
          Sports Planner
        </h1>

        <div id="status">Chargement...</div>
      </div>
    </header>

    <!-- 1. SPORT -->
    <section class="control-section">
      <span class="control-title">SPORT</span>

      <button id="sport-selector" class="selector" type="button">
        <span>
          <strong>NBA</strong>
          <small>Basketball</small>
        </span>

        <span class="chevron">⌄</span>
      </button>
    </section>

    <!-- 2. DAY -->
    <section class="control-section">
      <span class="control-title">JOUR</span>

      <nav class="date-navigation">
        <button id="previous-day" class="date-arrow" type="button">
          ‹
        </button>

        <div id="date-strip"></div>

        <button id="next-day" class="date-arrow" type="button">
          ›
        </button>
      </nav>
    </section>

    <!-- 3. TEAMS -->
    <section class="control-section filters">
      <span class="control-title">ÉQUIPES</span>

      <button id="filter-toggle" class="selector" type="button">
        <span id="filter-label">Toutes les équipes</span>
        <span class="chevron">⌄</span>
      </button>

      <div id="filter-panel" class="filter-panel hidden">

        <div class="filter-header">
          <strong>Filtrer les équipes</strong>

          <button id="clear-filter" type="button">
            Tout afficher
          </button>
        </div>

        <input
          id="team-search"
          type="search"
          placeholder="Rechercher une équipe..."
          autocomplete="off"
        >

        <div id="team-list"></div>
      </div>
    </section>

    <!-- 4. GAMES -->
    <section class="games-section">

      <div class="games-header">
        <span class="control-title">MATCHS</span>
        <span id="selected-date-label"></span>
      </div>

      <div id="games"></div>
    </section>

  </main>

  <script src="popup.js"></script>
</body>
</html>
